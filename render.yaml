# Render Blueprint — 저장소를 연결하면 이 설정대로 웹 서비스가 만들어진다.
services:
  - type: web
    name: liar-game
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 사회자 키는 Render가 무작위로 만든다. 대시보드 Environment 탭에서 확인.
      - key: HOST_KEY
        generateValue: true
      # 4자리 방 코드. 서비스를 만들 때 입력한다 (비워 두면 재시작마다 무작위).
      - key: ROOM_CODE
        sync: false
